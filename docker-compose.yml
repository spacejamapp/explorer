services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jamscan
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  jamscan:
    image: clearloop/jsvc:latest
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - jamscan_db:/app/jamscan.db
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/jamscan
      DATA_PATH: jamscan_db
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  jamscan_db:
  migrations:
