type Assurance {
	id: Int!
	block: Int!
	anchor: String!
	bitfield: String!
	validatorIndex: Int!
	signature: String!
}

type Block {
	anchor: Validator!
	header: BlockHeader!
	extrinsic: BlockExtrinsic!
}

type BlockConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [BlockEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Block!]!
}

"""
An edge in a connection.
"""
type BlockEdge {
	"""
	The item at the end of the edge
	"""
	node: Block!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type BlockExtrinsic {
	tickets: [Envelope!]!
	preimages: [Preimage!]!
	guarantees: [Guarantee!]!
	assurances: [Assurance!]!
	disputes: Dispute!
}

type BlockHeader {
	slot: Int!
	hash: String!
	parent: String!
	parentStateRoot: String!
	extrinsicHash: String!
	extrinsicCount: Int!
	authorIndex: Int!
	entropySource: String!
	seal: String!
	offendersMark: [String!]!
	epochMark: Epoch
	ticketsMark: [Ticket!]!
}

type Dispute {
	verdicts: [DisputeVerdict!]!
	culprits: [DisputeCulprit!]!
	faults: [DisputeFault!]!
}

type DisputeCulprit {
	id: Int!
	block: Int!
	target: String!
	key: String!
	signature: String!
}

type DisputeFault {
	id: Int!
	block: Int!
	target: String!
	vote: Boolean!
	key: String!
	signature: String!
}

type DisputeVerdict {
	id: Int!
	block: Int!
	target: String!
	age: Int!
	votes: [String!]!
}

type Envelope {
	id: Int!
	block: Int!
	attempt: Int!
	signature: String!
}

type Epoch {
	id: Int!
	block: Int!
	entropy: String!
	ticketsEntropy: String!
	blocks: Int!
	tickets: Int!
	preimages: Int!
	preimagesSize: Int!
	guarantees: Int!
	assurances: Int!
	validators(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): EpochValidatorConnection!
	cores(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): EpochCoreConnection!
}

type EpochCore {
	id: Int!
	epochId: Int!
	vindex: Int!
	gasUsed: Int!
	imports: Int!
	extrinsicCount: Int!
	extrinsicSize: Int!
	exports: Int!
	bundleSize: Int!
	daLoad: Int!
	popularity: Int!
	"""
	Get the Epoch
	"""
	epoch: Epoch!
}

