	"""
	refineGas: Int!
	"""
	Refine: the number of imports
	"""
	refineImports: Int!
	"""
	Refine: the number of extrinsic
	"""
	refineExtrinsicCount: Int!
	"""
	Refine: the size of extrinsic
	"""
	refineExtrinsicSize: Int!
	"""
