"""
ReportGuarantee (WorkReport)
"""
type Guarantee {
	id: Int!
	block: Int!
	slot: Int!
	"""
	The signatures [1:xxxx, 2:xxxx, 3:xxxx]
	"""
	signatures: [String!]!
	"""
	The hash of the package spec
	"""
	spec: String!
	"""
	The core index of this
	"""
	core: Int!
	"""
	The authorizer hash
	"""
	authorizerHash: String!
	"""
	The auth output
	"""
	authOutput: String!
	"""
	The auth gas used
	"""
	authGas: Int!
}

type Header {
	slot: Int!
	hash: String!
	parent: String!
	parentStateRoot: String!
	extrinsicHash: String!
	extrinsicCount: Int!
	authorIndex: Int!
	entropySource: String!
	seal: String!
	offendersMark: [String!]!
	currentEpoch: Int!
}

