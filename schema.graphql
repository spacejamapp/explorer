"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type Preimage {
	id: Int!
	block: Int!
	requester: Int!
	hash: String!
	blob: [Int!]!
}

type PreimageConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [PreimageEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Preimage!]!
}

"""
An edge in a connection.
"""
type PreimageEdge {
	"""
	The item at the end of the edge
	"""
	node: Preimage!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type QueryRoot {
	"""
	Get the spacejam cache
	"""
	spacejam: Spacejam!
	"""
	List headers by page
	"""
	headers(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): HeaderConnection!
	"""
	Get the raw block data from the database.
	"""
	blockRaw(slot: Int!): String!
	"""
	Get the block data from the database.
	"""
	block(slot: Int!): Block
	"""
	Get the epoch by id
	"""
	epoch(id: Int!): Epoch
	"""
	Get the epoch by id
	"""
	validator(id: Int!): Validator
	"""
	Get the core with all epoch statistics
	"""
	core(		index: Int!,		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): EpochCoreConnection!
	"""
	List all services
	"""
	services(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): ServiceConnection!
	"""
	Get the service
	"""
	service(id: Int!): Service
}

type Service {
	"""
	The key of the service
	"""
	id: Int!
	"""
	The code hash of the service account (c)
	"""
	code: String!
	"""
	The balance of the service account (b)
	"""
	balance: Int!
	"""
	The accumulate gas of the service account (g)
	"""
	accumulate: Int!
	"""
	The minimum required for the on transfer entry-point (m)
	"""
	transfer: Int!
	"""
	The total number of octets used in storage (o)
	"""
	total: Int!
	"""
	The number of items in storage (i)
	"""
	items: Int!
	preimages(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): PreimageConnection!
	works(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): WorkResultConnection!
}

type ServiceConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ServiceEdge!]!
	"""
