}

type EpochValidator {
	id: Int!
	epochId: Int!
	validatorId: Int!
	vindex: Int!
	blocks: Int!
	tickets: Int!
	preimages: Int!
	guarantees: Int!
	assurances: Int!
	"""
	Get the Epoch
	"""
	epoch: Epoch!
	"""
	Get the Validator
