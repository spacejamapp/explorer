"""
Spacejam global state
"""
type Spacejam {
	"""
	The total number of tickets
	"""
	tickets: Int!
	"""
	The total number of preimages
	"""
	preimages: Int!
	"""
	The total number of guarantees
	"""
	guarantees: Int!
	"""
	The total number of assurances
	"""
	assurances: Int!
	"""
	The total number of disputes verdicts
	"""
	disputesVerdicts: Int!
	"""
	The total number of disputes culprits
	"""
	disputesCulprits: Int!
	"""
	The total number of disputes faults
	"""
	disputesFaults: Int!
	"""
	The total number of blocks
	"""
	blocks: Int!
	"""
	The slot of the last finalized block
	"""
	finalized: Int!
	"""
	The total number of services
	"""
	services: Int!
	"""
	Current epoch
	"""
	epoch: Int!
	"""
	The total number of extrinsics
	"""
	extrinsics: Int!
}

type Ticket {
	id: Int!
	block: Int!
	ticketId: String!
	attempt: Int!
}

type Validator {
	id: Int!
	ed25519: String!
	bandersnatch: String!
	name: String!
	details: String!
	software: String!
	ip: String!
	website: String!
	scores: Int!
	"""
	List this validator's all epochs data (DESC)
	"""
	epochs(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): EpochValidatorConnection!
	"""
	List this validator's all anchor blocks (DESC)
	"""
	blocks(		first: Int = 10,
		"""
		Cursor for pagination
		"""
		after: String
	): BlockConnection!
}

