[package]
name = "jamscan"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-graphql = "7.0.17"
clap = { version = "4.5.37", features = ["derive", "env"] }
dotenv = "0.15.0"
hex = "0.4.3"
redis = "0.32.2"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.5", features = ["runtime-tokio-rustls", "postgres"] }
tokio = "1.44.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

# spacejam dependencies
jamcodec = { git = "ssh://git@github.com/spacejamapp/spacejam.git", branch = "jamscan" }
runtime = { git = "ssh://git@github.com/spacejamapp/spacejam.git", package = "spacejam-runtime", branch = "jamscan" }
score = { git = "ssh://git@github.com/spacejamapp/spacejam.git", package = "spacejam-core", branch = "jamscan" }
spacejam-crypto = { git = "ssh://git@github.com/spacejamapp/spacejam.git", branch = "jamscan" }
spacejson = { git = "ssh://git@github.com/spacejamapp/spacejam.git", branch = "jamscan" }
jadex = { git = "ssh://git@github.com/spacejamapp/spacejam.git", branch = "jamscan" }
