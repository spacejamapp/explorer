[package]
name = "jamscan"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
async-graphql = "7.0.16"
hex = "0.4.3"
sqlx = { version = "0.8.5", features = ["runtime-tokio-rustls", "postgres"] }
tokio = "1.44.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

# spacejam dependencies
runtime = { git = "https://github.com/spacejamapp/spacejam.git" }
score = { git = "https://github.com/spacejamapp/spacejam.git", package = "spacejam-core" }
jadex = { git = "https://github.com/spacejamapp/spacejam.git" }


[patch.crates-io]
async-graphql = { version = "7.0.16", git = "https://github.com/yasamoka/async-graphql.git", branch = "graphiqlsource-react" }
